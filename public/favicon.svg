<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Shield Neon Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Badge Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#374151" stroke-width="6" opacity="0.4" />

  <!-- Green Shield Emblem & Monogram -->
  <g filter="url(#glow)">
    <!-- Main Outer Shield Boundary -->
    <path
      d="M256 96 
         C312 96, 362 110, 390 126 
         V248 
         C390 340, 330 410, 256 440 
         C182 410, 122 340, 122 248 
         V126 
         C150 110, 200 96, 256 96 Z"
      fill="none"
      stroke="url(#greenGrad)"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner Monogram 'B' / 'P' Lines -->
    <path
      d="M204 156 V352"
      fill="none"
      stroke="url(#greenGrad)"
      stroke-width="22"
      stroke-linecap="round"
    />
    
    <path
      d="M204 168 H276 C306 168, 326 186, 326 212 C326 238, 306 256, 276 256 H204"
      fill="none"
      stroke="url(#greenGrad)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M204 256 H284 C318 256, 338 276, 338 304 C338 332, 318 352, 284 352 H204"
      fill="none"
      stroke="url(#greenGrad)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Gold Accent Sparkles (Matching official logo detail) -->
  <g fill="url(#goldGrad)">
    <path d="M372 206 Q384 206 384 194 Q384 206 396 206 Q384 206 384 218 Q384 206 372 206 Z" />
    <path d="M396 244 Q404 244 404 236 Q404 244 412 244 Q404 244 404 252 Q404 244 396 244 Z" />
    <circle cx="362" cy="236" r="6" />
  </g>
</svg>
